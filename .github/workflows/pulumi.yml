name: Pulumi

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# All OCI/Cloudflare/n8n secrets already live encrypted in the stack's
# config on Pulumi Cloud (see Pulumi.dev.yaml + README prerequisites) —
# PULUMI_ACCESS_TOKEN is the only credential CI needs, to authenticate
# and let Pulumi decrypt that config itself.
jobs:
  pulumi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: pulumi/actions@v6
        with:
          command: ${{ github.event_name == 'pull_request' && 'preview' || 'up' }}
          stack-name: bucsai/n8n-oci-gitops/dev
          comment-on-pr: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
